name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Write .env.local
        run: echo "${{ secrets.ENV_LOCAL_CONTENTS }}" > .env.local

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Next's standalone output doesn't automatically include public/ or
      # .next/static — Next explicitly requires copying these in manually.
      - name: Assemble deployable bundle
        run: |
          mkdir -p deploy_package
          cp -r .next/standalone/. deploy_package/
          mkdir -p deploy_package/.next
          cp -r .next/static deploy_package/.next/static
          cp -r public deploy_package/public
          rm -f deploy_package/.env.local

      - name: Debug bundle size
        run: |
          echo "Total size:"
          du -sh deploy_package/
          echo ""
          echo "Top 20 largest items:"
          du -sh deploy_package/* deploy_package/.next/* 2>/dev/null | sort -rh | head -20
          echo ""
          echo "node_modules breakdown (if present):"
          du -sh deploy_package/node_modules/* 2>/dev/null | sort -rh | head -15

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create remote release directory
        run: |
          RELEASE_NAME=$(date +%Y%m%d%H%M%S)
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p /home/nezalherbocare.com/releases/$RELEASE_NAME"

      - name: Upload build to VPS
        run: |
          rsync -avz --progress --delete -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            deploy_package/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/nezalherbocare.com/releases/${{ env.RELEASE_NAME }}/

      - name: Finalize release on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: RELEASE_NAME
          script: |
            set -e
            PM2="/root/.nvm/versions/node/v20.19.0/bin/pm2"

            APP_ROOT="/home/nezalherbocare.com"
            RELEASES_DIR="$APP_ROOT/releases"
            CURRENT_LINK="$APP_ROOT/current"
            SHARED_DIR="$APP_ROOT/shared"
            RELEASE_DIR="$RELEASES_DIR/$RELEASE_NAME"

            # Link in things that must persist and aren't part of the build:
            # env vars and user-uploaded files.
            ln -sfn "$SHARED_DIR/.env.local" "$RELEASE_DIR/.env.local"
            mkdir -p "$SHARED_DIR/uploads"
            rm -rf "$RELEASE_DIR/public/uploads"
            ln -sfn "$SHARED_DIR/uploads" "$RELEASE_DIR/public/uploads"

            # Atomic swap — instant, no half-updated window.
            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

            # Delete + fresh start instead of startOrReload — PM2 can cache
            # a stale script path (e.g. next start vs server.js) across
            # reloads and ignore an updated ecosystem.config.js entry point.
            "$PM2" delete nezal 2>/dev/null || true
            "$PM2" start "$APP_ROOT/current/ecosystem.config.js"

            # Keep last 5 releases, prune older.
            cd "$RELEASES_DIR"
            ls -t | tail -n +6 | xargs -r rm -rf